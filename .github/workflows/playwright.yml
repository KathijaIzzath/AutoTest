name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs daily at 7:30 PM Central (CDT = UTC-5 → 00:30 UTC)
    # Note: during CST (UTC-6) this is 6:30 PM local; adjust cron if needed.
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPORT_OUTPUT_DIR: playwright-report/daily-summary
      FAIL_ON_AUTH_UNAVAILABLE: 'false'
      FLAKE_RATE_THRESHOLD: '0.05'
      FLAKE_RATE_GROWTH_THRESHOLD: '0.02'
      MAX_TIMEOUT_TESTS: '3'
      MAX_RETRY_ATTEMPTS: '20'
      SLOW_SPEC_THRESHOLD_MS: '120000'
      FAIL_ON_FLAKE_REGRESSION: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Run Playwright tests (full suite)
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload daily test summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daily-test-summary
          path: ${{ env.REPORT_OUTPUT_DIR }}/
          if-no-files-found: ignore
